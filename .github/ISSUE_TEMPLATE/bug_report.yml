name: Bug report
description: Something in SIGMAI does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: open the SIGMAI panel and press **Test connection** (step 3). It checks the bridge, authentication, session file, MCP server, project and access mode, and usually names the failing step directly.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you asked for, what SIGMAI did, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: self-test
    attributes:
      label: Result of "Test connection"
      description: Paste the six lines from step 3 of the panel.
      render: text
  - type: textarea
    id: audit
    attributes:
      label: Audit report, if a map is involved
      description: The `audit` block returned by compose_map. It names the rules that failed.
      render: json
  - type: input
    id: qgis
    attributes:
      label: QGIS version
      placeholder: "3.44.3 or 4.2.2"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: AI client
      placeholder: "Claude Desktop 1.x, Cursor, Codex CLI…"
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, Ubuntu 24.04, macOS 15…"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: The last lines of sigmai/logs/sigmai.jsonl. They never contain the token.
      render: text
