name: tests

on:
  push:
    branches: [main, "v*"]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (no QGIS)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        # PyQt6 entra para que o verificador de compatibilidade e o teste do
        # painel rodem de verdade: foi um enum só-do-Qt5 que impediu o plugin
        # de abrir no QGIS 4.
        run: python -m pip install --upgrade pip pytest PyQt6
      # A suíte roda sem QGIS de propósito: as decisões cartográficas e o
      # protocolo MCP vivem em módulos que não importam PyQGIS, justamente
      # para poderem ser verificados aqui.
      - name: Run tests
        run: python -m pytest tests -q

  qgis:
    name: Smoke test inside QGIS
    runs-on: ubuntu-latest
    container: qgis/qgis:release-3_34
    steps:
      - uses: actions/checkout@v4
      - name: Compose a map and audit it
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 -m pip install --break-system-packages pytest || true
          python3 tools/ci_compose_smoke_test.py
      - name: Check QGIS enum aliases
        run: python3 tools/check_qt6_compat.py sigmai --mode qgis

  qt6:
    name: Qt6 / QGIS 4 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip PyQt6
      - name: Static enum check
        run: python tools/check_qt6_compat.py sigmai --mode qt
      - name: Build the panel against PyQt6
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3
          python tools/qt6_panel_check.py
      - name: plugins.qgis.org Qt6 Check (QGIS pyqt5_to_pyqt6.py)
        run: |
          python -m pip install --quiet PyQt6-QScintilla tokenize-rt
          python tools/qgis_qt6_check.py

  metadata:
    name: Plugin metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate metadata.txt and package layout
        run: python tools/validate_plugin_package.py
      - name: Security scan of plugins.qgis.org (Bandit, detect-secrets, Flake8)
        run: |
          python -m pip install --quiet bandit detect-secrets flake8
          python tools/qgis_repository_scan.py
